name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Weekly rebuild on a freshly pulled base so OS security fixes land without a code change.
  # Friday 08:00 UTC, so Saturday's security sweep sees the result.
  schedule:
    - cron: '0 8 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cookbook_test
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint
        run: |
          cd backend
          ruff check .
          black --check .
      - name: WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Run tests
        env:
          COOKBOOK_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/cookbook_test
          COOKBOOK_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
        run: |
          cd backend
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ghcr.io/mcheli/cookbook:ci-${{ github.sha }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Smoke test the image (migrate, healthy, no build tools)
        env:
          IMAGE: ghcr.io/mcheli/cookbook:ci-${{ github.sha }}
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=cookbook postgres:16.16
          docker run -d --name app --network smoke -p 8000:8000 \
            -e COOKBOOK_DATABASE_URL=postgresql+asyncpg://postgres:smoke@db:5432/cookbook \
            -e COOKBOOK_JWT_SECRET=ci-smoke-secret-at-least-32-characters-long \
            -e COOKBOOK_OWNER_EMAILS=owner@smoke.test \
            "$IMAGE"
          for _ in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' app); [ "$s" = healthy ] && break; sleep 2
          done
          docker logs app
          [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ]
          # The site, the bundled recipes, a recipe page with its schema.org data, a PDF, the Home Screen app files.
          curl -fsS http://localhost:8000/ | grep -q '<div id="app">'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -I http://localhost:8000/)" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -I http://localhost:8000/r/garlic-butter-shrimp)" = 200 ]
          [ "$(curl -fsS http://localhost:8000/api/recipes | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 38 ]
          curl -fsS http://localhost:8000/r/garlic-butter-shrimp | grep -q 'application/ld+json'
          curl -fsS -o /tmp/r.pdf http://localhost:8000/api/recipes/garlic-butter-shrimp/pdf && head -c 4 /tmp/r.pdf | grep -q '%PDF'
          curl -fsS -o /dev/null -w '%{content_type}' http://localhost:8000/manifest.webmanifest | grep -q 'manifest+json'
          for icon in apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png; do
            curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:8000/$icon" | grep -q '^image/png'
          done
          # The demo: same image in demo mode seeds itself and refuses writes.
          docker run -d --name demodb --network smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=demo postgres:16.16
          sleep 5
          docker run -d --name demo --network smoke -p 8001:8000 \
            -e COOKBOOK_DATABASE_URL=postgresql+asyncpg://postgres:smoke@demodb:5432/demo \
            -e COOKBOOK_JWT_SECRET=ci-smoke-secret-at-least-32-characters-long \
            -e COOKBOOK_DEMO_MODE=true \
            "$IMAGE"
          for _ in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' demo); [ "$s" = healthy ] && break; sleep 2
          done
          docker logs demo | tail -20
          curl -fsS http://localhost:8001/api/auth/config | grep -q '"demo_mode":true'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/api/recipes -H 'Content-Type: application/json' -d '{}')" = 403 ]
          docker run --rm --entrypoint sh "$IMAGE" -c '! command -v curl && ! command -v gcc && ! command -v cc'
          docker image inspect -f 'image size: {{.Size}} bytes' "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c 'echo "dpkg packages: $(dpkg-query -W | wc -l)"'

  # Publish only after every check above passed, and never for pull requests.
  # Scheduled and manual runs publish only from main.
  release:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      fresh-base: ${{ github.event_name == 'schedule' }}
